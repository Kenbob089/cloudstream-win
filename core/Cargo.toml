[package]
name = "cloudstream-core"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "cloudstream_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
percent-encoding = "2"
roxmltree = "0.20"
scraper = "0.20"
regex = "1"
